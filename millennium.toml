[plugin]
id          = "steamapp-verlock"
name        = "Steam App Verlock"
version     = "0.1.0"
author      = "jks15satoshi"
description = "Locks Steam apps to their installed builds, preventing them from auto-updating."

[backend]
entry   = "backend/main.lua"
sources = ["backend/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart        = true
reload_steamui_when = "both"

[logger]
backend_prefix  = "backend"
frontend_prefix = "frontend"

[inspect]
depth       = 4
colors      = true
show_hidden = true

[patches]
debug = true
